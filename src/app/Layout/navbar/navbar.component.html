<header class="header p-shadow-4">
  <!-- Left side: Sidebar Toggle + Title -->
  <div class="left-section">
    <i class="pi pi-bars sidebar-toggle" (click)="toggleSidebar()"></i>
    <h1 class="company-name">GFSS HR PORTAL</h1>
  </div>

  <!-- Right side: Date + User Icon -->
  <div class="header-right">
    <span class="date-text">{{ today }}</span>
    <!-- User icon with click -->
    <i class="pi pi-user user-icon" (click)="goToProfile()"></i>
  </div>
</header>

<!-- Sidebar -->
<nav class="sidebar" [class.active]="sidebarVisible">
  <div class="sidebar-content">
    <!-- Dashboard -->
    <a routerLink="/navbar/dashboard" *ngIf="role === 'HR'" class="nav-link">
      <i class="pi pi-home"></i> HR Dashboard
    </a>
    <a routerLink="/navbar/dashboard" *ngIf="role === 'EMPLOYEE'" class="nav-link">
      <i class="pi pi-home"></i> Dashboard
    </a>

    <!-- Announcements -->
    <a routerLink="/navbar/announcement" class="nav-link">
      <i class="pi pi-megaphone"></i> Announcements
    </a>

    <!-- Holidays -->
    <a routerLink="/navbar/holidays" class="nav-link">
      <i class="pi pi-sun"></i> Holidays
    </a>

    <!-- Letters -->
    <a routerLink="/navbar/letters" class="nav-link">
      <i class="pi pi-envelope"></i> Letters
    </a>

    <!-- Meetings -->
    <a routerLink="/navbar/meeting" class="nav-link">
      <i class="pi pi-users"></i> Meeting
    </a>

    <!-- My HR -->
    <a routerLink="/navbar/my-hr" class="nav-link">
      <i class="pi pi-briefcase"></i> My HR
    </a>

    <!-- Resignation -->
    <a routerLink="/navbar/resignation" class="nav-link">
      <i class="pi pi-sign-out"></i> Resignation
    </a>

    <!-- Help -->
    <a routerLink="/navbar/help" class="nav-link">
      <i class="pi pi-question-circle"></i> Help
    </a>

    <!-- Logout -->
    <a (click)="logout()" class="nav-link logout-link">
      <i class="pi pi-power-off"></i> Logout
    </a>
  </div>
</nav>

<!-- Content Section -->
<main class="content" [class.sidebar-open]="sidebarVisible">
  <router-outlet></router-outlet>
</main>
