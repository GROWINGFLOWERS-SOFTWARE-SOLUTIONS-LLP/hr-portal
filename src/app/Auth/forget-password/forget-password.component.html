<div class="wrapper">
  <div class="form-card">
    <h2>Forget Password</h2>
    <p>Enter your email and new password to continue.</p>

    <form [formGroup]="forgetForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email address*</label>
        <input
          type="email"
          formControlName="email"
          [class.invalid]="submitted && f['email'].errors"
        />
        <div class="error" *ngIf="submitted && f['email'].errors">
          <small *ngIf="f['email'].errors['required']">Email is required</small>
          <small *ngIf="f['email'].errors['email']">Enter a valid email</small>
        </div>
      </div>

      <div class="form-group">
        <label>New password*</label>
        <input
          type="password"
          formControlName="newPassword"
          [class.invalid]="submitted && f['newPassword'].errors"
        />
        <div class="error" *ngIf="submitted && f['newPassword'].errors">
          <small>Password is required</small>
        </div>
      </div>

      <div class="form-group">
        <label>Re-enter new password*</label>
        <input
          type="password"
          formControlName="confirmPassword"
          [class.invalid]="
            submitted && (f['confirmPassword'].errors || forgetForm.errors?.['mismatch'])
          "
        />
        <div
          class="error"
          *ngIf="submitted && (f['confirmPassword'].errors || forgetForm.errors?.['mismatch'])"
        >
          <small *ngIf="f['confirmPassword'].errors?.['required']">Confirmation is required</small>
          <small *ngIf="forgetForm.errors?.['mismatch']">Passwords do not match</small>
        </div>
      </div>

      <button type="submit">SAVE</button>
    </form>
  </div>
</div>

<!-- Success popup -->
<div *ngIf="showSuccessPopup" class="success-popup" [class.fade-out]="popupFadingOut">
  Password changed successfully
</div>
