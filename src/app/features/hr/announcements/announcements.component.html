<div class="announcements-container">
  <!-- Create Button -->
  <div class="create-button">
    <button
      pButton
      type="button"
      icon="pi pi-plus"
      label="Create Announcement"
      (click)="openCreateDialog()"
    ></button>
  </div>

  <!-- Announcement Cards -->
  <div class="announcement-grid">
    <p-card *ngFor="let item of paginatedAnnouncements" class="announcement-card">
      <!-- Action Buttons -->
      <div class="card-actions">
        <button
          pButton
          type="button"
          icon="pi pi-pencil"
          class="p-button-sm p-button-success"
          (click)="openEditDialog(item)"
        ></button>
        <button
          pButton
          type="button"
          icon="pi pi-trash"
          class="p-button-sm p-button-danger"
          (click)="deleteAnnouncement(item.announcementId)"
        ></button>
      </div>

      <!-- Card Header -->
      <ng-template pTemplate="header">
        <div class="card-header">
          <img
            src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
            alt="avatar"
            class="avatar"
          />
          <div class="card-info">
            <h4>{{ item.name }}</h4>
            <p>{{ item.date | date : 'mediumDate' }} - {{ item.time }}</p>
          </div>
        </div>
      </ng-template>

      <!-- Card Content -->
      <p class="message">{{ item.message }}</p>

      <!-- Card Footer -->
      <ng-template pTemplate="footer">
        <button
          pButton
          type="button"
          icon="pi pi-thumbs-up"
          label="Like"
          class="p-button-text"
        ></button>
      </ng-template>
    </p-card>
  </div>

  <!-- Pagination -->
  <p-paginator
    [rows]="rows"
    [totalRecords]="announcements.length"
    (onPageChange)="onPageChange($event)"
    styleClass="paginator"
  ></p-paginator>

  <!-- Create/Edit Dialog -->
  <p-dialog
    header="{{ isEditMode ? 'Edit Announcement' : 'Create Announcement' }}"
    [(visible)]="showDialog"
    [modal]="true"
    [style]="{ width: '400px' }"
  >
    <div class="dialog-form">
      <label>Title</label>
      <input
        pInputText
        [(ngModel)]="announcement.title"
        placeholder="Enter title"
      />

      <label>Description</label>
      <textarea
        pInputText
        [(ngModel)]="announcement.description"
        rows="3"
        placeholder="Enter message"
      ></textarea>

      <label>Date</label>
      <p-calendar
        [(ngModel)]="announcement.date"
        showIcon="true"
        dateFormat="yy-mm-dd"
      ></p-calendar>
    </div>

    <ng-template pTemplate="footer">
      <button
        pButton
        label="Cancel"
        class="p-button-text"
        (click)="resetForm()"
      ></button>
      <button
        pButton
        label="Save"
        (click)="submitAnnouncement()"
        [disabled]="
          !announcement.title || !announcement.description || !announcement.date
        "
      ></button>
    </ng-template>
  </p-dialog>
</div>

<!-- Success popup -->
<div
  *ngIf="showDeleteSuccessPopup"
  class="success-popup"
  [class.fade-out]="popupFadingOut"
>
  Announcement deleted successfully
</div>
