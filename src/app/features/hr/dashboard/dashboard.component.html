<div class="portal-container">
  <!-- Sidebar -->
  <div class="sidebar" *ngIf="sidebarVisible">
    <ul class="menu-list">
      <li
        *ngFor="let item of menuItems"
        (click)="selectSection(item.section)"
        [class.active]="activeSection === item.section">
        <i class="{{ item.icon }}"></i> {{ item.label }}
      </li>
    </ul>
  </div>
<div class="charts-container">
  <p-card header="Hiring Distribution (Pie)">
    <p-chart type="pie" [data]="pieChartData"></p-chart>
  </p-card>

  <p-card header="Monthly Stats (Bar)">
    <p-chart type="bar" [data]="barChartData"></p-chart>
  </p-card>
</div>

  <!-- Main Content -->
  <div class="content-area">
    <ng-container [ngSwitch]="activeSection">
      <div *ngSwitchCase="'Dashboard'" class="card-grid">
        <p-card header="Registered" class="dashboard-card recruiter"><p>12</p></p-card>
        <p-card header="Mapped" class="dashboard-card interviewed"><p>9</p></p-card>
        <p-card header="Interviewed" class="dashboard-card rejected"><p>2</p></p-card>
        <p-card header="Hold" class="dashboard-card hold"><p>1</p></p-card>
        <p-card header="Offer Letter" class="dashboard-card offer"><p>5</p></p-card>
       
        <p-card header="Registered" class="dashboard-card recruiter"><p>12</p></p-card>
        <p-card header="Mapped" class="dashboard-card interviewed"><p>9</p></p-card>
        <p-card header="Interviewed" class="dashboard-card rejected"><p>2</p></p-card>
        <p-card header="Hold" class="dashboard-card hold"><p>1</p></p-card>
        <p-card header="Offer Letter" class="dashboard-card offer"><p>5</p></p-card>
      </div>

      <div *ngSwitchCase="'Letters'">
        <p-panel header="Letters Section"><p>Display letters here.</p></p-panel>
      </div>

      <div *ngSwitchCase="'Meeting'">
        <p-panel header="Meeting Section"><p>Meetings content here.</p></p-panel>
      </div>

      <div *ngSwitchCase="'MyHR'">
        <p-panel header="My HR"><p>HR details here.</p></p-panel>
      </div>

      <div *ngSwitchDefault>
        <p-panel header="{{ activeSection }}"><p>Content for {{ activeSection }}</p></p-panel>
      </div>
    </ng-container>
  </div>
</div>
