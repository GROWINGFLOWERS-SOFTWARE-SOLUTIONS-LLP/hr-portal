<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="letters-container">
  <h2>Employee Letters</h2>
  <button pButton label="Upload Letter" icon="pi pi-upload" (click)="openUploadDialog()"></button>

  <p-table [value]="letters" [paginator]="true" [rows]="5">
    <ng-template pTemplate="header">
      <tr>
        <th>Employee Name</th>
        <th>Letter Type</th>
        <th>File Name</th>
        <th>Upload Date</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-letter>
      <tr>
        <td>{{ letter.empName }}</td>
        <td>{{ letter.letterType }}</td>
        <td>{{ letter.fileName }}</td>
        <td>{{ letter.uploadDate }}</td>
        <td>
          <button pButton icon="pi pi-download" class="p-button-text" (click)="downloadLetter(letter.letterId!, letter.fileName)"></button>
          <button pButton icon="pi pi-trash" class="p-button-text p-button-danger" (click)="confirmDelete(letter.letterId!)"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Upload Dialog -->
<p-dialog header="Upload Letter" [(visible)]="displayUploadDialog" [modal]="true" [style]="{width: '420px'}">
  <div class="upload-letter-container">
    <div class="p-field">
      <label>Employee Name</label>
      <input pInputText [(ngModel)]="uploadData.employeeName" />
    </div>
    <div class="p-field">
      <label>Letter Type</label>
      <p-dropdown [options]="letterTypes" [(ngModel)]="uploadData.letterType" optionLabel="label" optionValue="value"></p-dropdown>
    </div>

    <!-- Buttons Row -->
    <div class="upload-actions">
      <p-fileUpload 
        mode="basic" 
        name="file" 
        accept=".pdf" 
        chooseLabel="Select PDF" 
        customUpload="true" 
        (onSelect)="handleFileSelect($event)" 
        class="select-pdf-btn">
      </p-fileUpload>

      <button pButton 
        label="Upload" 
        icon="pi pi-check" 
        class="upload-btn"
        (click)="uploadLetter()">
      </button>
    </div>
  </div>
</p-dialog>
