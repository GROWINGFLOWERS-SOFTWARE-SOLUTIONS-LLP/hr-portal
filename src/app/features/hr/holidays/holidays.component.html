<!-- src/app/components/holidays/holidays.component.html -->

<div class="container">
  <section>
    <h1>Public & Festival Holidays</h1>
    <div class="card-grid">
      <div class="card" *ngFor="let holiday of publicHolidays">
        <h3>{{ holiday.holidayName }}</h3>
        <p><strong>📅 Date:</strong> {{ holiday.date }}</p>
        <p><strong>📝 Description:</strong> {{ holiday.description }}</p>
      </div>
    </div>
  </section>
</div>
