<div class="meeting-wrapper">
  <div class="text-center">
    <h1 class="page-title">HR Meeting Section</h1>
  </div>

  <div class="form-card">
    <div class="form-title">Schedule a Meeting</div>

    <div class="form-fields">
      <!-- Employee Name -->
      <div class="form-group">
        <label class="form-label">Employee Name</label>
        <p-dropdown
          [options]="employeeOptions"
          [(ngModel)]="meeting.employeeName"
          optionLabel="name"
          placeholder="Select Employee"
          class="w-full"
        ></p-dropdown>
      </div>

      <!-- HR Name
      <div class="form-group">
        <label class="form-label">Select HR</label>
        <p-dropdown
          [options]="hrNames"
          [(ngModel)]="meeting.hrName"
          optionLabel="label"
          placeholder="Select HR"
          class="w-full"
        ></p-dropdown>
      </div> -->

      <!-- Date -->
      <div class="form-group">
        <label class="form-label">Meeting Date</label>
        <p-calendar
          [(ngModel)]="meeting.date"
          showIcon="true"
          class="w-full"
          dateFormat="yy-mm-dd"
        ></p-calendar>
      </div>

      <!-- Topic -->
      <div class="form-group">
        <label class="form-label">Topic</label>
        <input
          pInputText
          [(ngModel)]="meeting.topic"
          class="w-full"
        />
      </div>

      <!-- Conclusion -->
      <div class="form-group">
        <label class="form-label">Conclusion</label>
        <textarea
          pInputTextarea
          [(ngModel)]="meeting.conclusion"
          rows="3"
          class="w-full"
        ></textarea>
      </div>

      <!-- Buttons -->
      <div class="button-group">
        <button
          pButton
          label="Save"
          class="save-btn"
          (click)="onSave()"
          [disabled]="!meeting.employeeName || !meeting.date || !meeting.topic || !meeting.conclusion"
        ></button>

        <button
          pButton
          label="Clear"
          class="clear-btn"
          (click)="onClear()"
        ></button>
      </div>
    </div>
  </div>

  <!-- ✅ Success Popup -->
  <p-dialog
    header="✅ Meeting has been scheduled successfully."
    [(visible)]="showSuccessPopup"
    [modal]="true"
    [closable]="true"
    [style]="{ width: '500px' }"
  >
    <!-- <p>✅ Meeting has been scheduled successfully.</p> -->
  </p-dialog>
</div>
