
<div class="min-h-screen bg-gray-50 p-4 md:p-10 flex items-center justify-center">
  <div class="w-full max-w-7xl space-y-10">
   
    <!-- Header -->
    <div class="text-center">
      <h1 class="text-3xl md:text-4xl font-bold text-indigo-700">HR Meeting Scheduler</h1>
      
    </div>
 
    <!-- Main Content: Two Equal Columns -->
    <div class="flex flex-col md:flex-row gap-8">
     
      <!-- Left Panel: Form (50%) -->
      <div class="w-full md:w-1/2 bg-white p-6 md:p-8 rounded-2xl shadow-md border border-gray-200 space-y-6">
        <h2 class="text-xl font-semibold text-indigo-600">Schedule a New Meeting</h2>
 
        <div class="space-y-4">
          <!-- Employee Name -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Employee Name</label>
            <p-dropdown
              [options]="employeeOptions"
              [(ngModel)]="meeting.employeeName"
              optionLabel="name"
              placeholder="Select Employee"
              name="employeeName"
              class="w-full">
            </p-dropdown>
          </div>
 
          <!-- HR Name -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Select HR</label>
            <p-dropdown
              [options]="hrNames"
              [(ngModel)]="meeting.hrName"
              optionLabel="label"
              placeholder="Select HR"
              name="hrName"
              class="w-full">
            </p-dropdown>
          </div>
 
          <!-- Meeting Date -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Meeting Date</label>
            <p-calendar
              [(ngModel)]="meeting.date"
              name="date"
              showIcon="true"
              class="w-full"
              dateFormat="yy-mm-dd">
            </p-calendar>
          </div>
 
          <!-- Topic -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Topic</label>
            <input pInputText [(ngModel)]="meeting.topic" name="topic" class="w-full" />
          </div>
 
          <!-- Conclusion -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Conclusion</label>
            <textarea
              pInputTextarea
              [(ngModel)]="meeting.conclusion"
              name="conclusion"
              rows="3"
              class="w-full">
            </textarea>
          </div>
 
          <!-- Buttons -->
          <div class="flex justify-end space-x-4 pt-4">
            <button
              pButton
              label="Save"
              class="bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-700"
              (click)="onSave()"
              type="button">
            </button>
            <button
              pButton
              label="Clear"
              class="bg-white text-indigo-600 border border-indigo-400 px-6 py-2 rounded-md hover:bg-indigo-100"
              (click)="onClear()"
              type="button">
            </button>
          </div>
        </div>
      </div>
 
      <!-- Right Panel: Meeting List (50%) -->
      <div class="w-full md:w-1/2 bg-white p-6 md:p-8 rounded-2xl shadow-md border border-gray-200">
        <h2 class="text-xl font-semibold text-indigo-600 mb-4">Scheduled Meetings</h2>
 
        <p-table
          [value]="meetingsList"
          *ngIf="meetingsList.length > 0"
          [paginator]="true"
          [rows]="5"
          responsiveLayout="scroll">
         
          <ng-template pTemplate="header">
            <tr>
              <th>Employee</th>
              <th>HR</th>
              <th>Date</th>
              <th>Topic</th>
              <th>Conclusion</th>
              <th>Action</th>
            </tr>
          </ng-template>
 
          <ng-template pTemplate="body" let-meeting let-i="rowIndex">
            <tr>
              <td>{{ meeting.employeeName?.name }}</td>
              <td>{{ meeting.hrName?.label }}</td>
              <td>{{ meeting.date | date: 'yyyy-MM-dd' }}</td>
              <td>{{ meeting.topic }}</td>
              <td>{{ meeting.conclusion }}</td>
              <td>
                <button
                  pButton
                  icon="pi pi-pencil"
                  class="p-button-text text-indigo-600"
                  (click)="onEdit(i)">
                </button>
              </td>
            </tr>
          </ng-template>
        </p-table>
 
        <p *ngIf="meetingsList.length === 0" class="text-center text-gray-500 mt-6">
          No meetings added yet.
        </p>
      </div>
    </div>
  </div>
</div>
